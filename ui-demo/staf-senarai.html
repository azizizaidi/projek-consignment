<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kedai Saya — Staf</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
<link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SAS EMPIRE">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
</head>
<body>
<div class="mobile-shell">
  <div id="app"></div>
  <div id="tabbar-slot"></div>
</div>

<script src="assets/data.js"></script>
<script src="assets/ui.js"></script>
<script>
const user = requireLogin("staf");

function render() {
  if (!user) return;
  const kawasanIds = user.kawasan_ids;
  const outlets = DB.outlets.filter((o) => kawasanIds.includes(o.kawasan_id));
  const q = (document.getElementById("q") ? document.getElementById("q").value : "").toLowerCase();
  const tersaring = outlets.filter(
    (o) => o.nama_kedai.toLowerCase().includes(q) || o.nama_owner.toLowerCase().includes(q)
  );
  const totalBaki = outlets.reduce((s, o) => s + bakiBelumKutip(o.id), 0);

  const senaraiHtml = tersaring.length
    ? tersaring.map((o, i) => {
        const aktif = papanAktif(o.id);
        const baki = bakiBelumKutip(o.id);
        return `
        <a href="staf-kedai.html?id=${o.id}" class="tap-scale card card-hover block p-4 anim-fade anim-d${Math.min(i + 1, 3)}">
          <div class="flex items-start gap-3">
            ${avatarHtml(o.nama_owner, o.mod_bayar_default === "bayar_dulu" ? "info" : "violet")}
            <div class="flex-1 min-w-0">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <p class="font-semibold text-slate-800 text-sm truncate">${o.nama_kedai}</p>
                  <p class="text-xs text-slate-400 truncate">${o.nama_owner} · ${kawasanNama(o.kawasan_id)}</p>
                </div>
                ${modChip(o.mod_bayar_default)}
              </div>
              <div class="flex gap-5 mt-3 pt-3 divider">
                <div>
                  <p class="text-[10px] text-slate-400 font-medium uppercase tracking-wide">Papan Aktif</p>
                  <p class="font-bold text-sm text-slate-700 mt-0.5">${aktif} papan</p>
                </div>
                <div>
                  <p class="text-[10px] text-slate-400 font-medium uppercase tracking-wide">Baki Belum Kutip</p>
                  <p class="font-bold text-sm mt-0.5 ${baki > 0 ? "text-rose-500" : "text-emerald-600"}">${fmtRM(baki)}</p>
                </div>
              </div>
            </div>
          </div>
        </a>`;
      }).join("")
    : `<div class="card empty-state anim-fade"><div class="empty-ic">🔍</div><p class="text-sm">Tiada kedai dijumpai.</p></div>`;

  document.getElementById("app").innerHTML = `
    <div class="hero-card mx-4 mt-4 p-5 anim-fade">
      <div class="flex items-center gap-2 mb-3">
        <div class="w-8 h-8 rounded-xl bg-white/15 border border-white/20 flex items-center justify-center text-white font-extrabold text-[10px] tracking-wide">SAS</div>
        <p class="text-white font-bold text-xs tracking-wide">SAS EMPIRE</p>
      </div>
      <div class="flex items-start justify-between">
        <div>
          <p class="text-indigo-100 text-xs font-medium">Selamat kembali 👋</p>
          <h1 class="text-lg font-bold leading-snug mt-0.5">${user.nama}</h1>
          <p class="text-indigo-100 text-xs mt-1">📍 ${kawasanIds.map(kawasanNama).join(" · ")}</p>
        </div>
        <button onclick="logout()" class="tap-scale text-xs bg-white/15 border border-white/20 text-white px-3 py-1.5 rounded-lg font-medium">Log Keluar</button>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3 px-4 mt-4 anim-fade anim-d1">
      <div class="card p-4">
        <div class="flex items-center gap-2 text-slate-400 text-xs font-medium"><span>🏪</span> Jumlah Kedai</div>
        <p class="text-2xl font-extrabold text-slate-800 mt-1">${outlets.length}</p>
      </div>
      <div class="card p-4">
        <div class="flex items-center gap-2 text-slate-400 text-xs font-medium"><span>💰</span> Baki Belum Kutip</div>
        <p class="text-2xl font-extrabold mt-1 ${totalBaki > 0 ? "text-rose-500" : "text-emerald-600"}">${fmtRM(totalBaki)}</p>
      </div>
    </div>

    <div class="px-4 mt-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold text-slate-700 text-sm">Kedai Kawasan Anda</h2>
        <span class="text-xs text-slate-400">${tersaring.length} kedai</span>
      </div>
      <input id="q" type="text" placeholder="🔍 Cari kedai / owner..." class="input mb-3" value="${q}" oninput="render()" />
      <div class="space-y-3">${senaraiHtml}</div>
    </div>`;

  document.getElementById("tabbar-slot").innerHTML = tabbarHtml("kedai");
  if (q) {
    const input = document.getElementById("q");
    input.focus();
    input.setSelectionRange(q.length, q.length);
  }
}
render();
</script>
</body>
</html>
