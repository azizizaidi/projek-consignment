<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SAS EMPIRE — Superadmin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
<link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SAS EMPIRE">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
</head>
<body>
<div class="flex min-h-screen">

  <!-- Sidebar (desktop) -->
  <aside class="w-60 flex-shrink-0 p-4 flex-col hidden md:flex" style="background:#0f172a;">
    <div class="flex items-center gap-2.5 px-2 mb-8">
      <div class="w-10 h-10 rounded-2xl flex items-center justify-center text-white font-extrabold text-xs tracking-wide" style="background:linear-gradient(135deg,#4f46e5,#7c3aed);">SAS</div>
      <div>
        <p class="text-white font-bold text-sm leading-tight">SAS EMPIRE</p>
        <p class="text-slate-500 text-xs">Panel Superadmin</p>
      </div>
    </div>
    <nav class="space-y-1.5 flex-1" id="sideNav"></nav>
    <div class="pt-3" style="border-top:1px solid rgba(255,255,255,0.08);">
      <button onclick="resetConfirm()" class="side-link">🔄 Reset Data Demo</button>
      <button onclick="logout()" class="side-link" style="color:#fda4af;">↩️ Log Keluar</button>
    </div>
  </aside>

  <!-- Kandungan -->
  <main class="flex-1 min-w-0">
    <!-- Topbar -->
    <div class="bg-white px-4 md:px-8 py-4 flex items-center justify-between" style="border-bottom:1px solid var(--line);">
      <div>
        <h1 id="pageTitle" class="text-lg md:text-xl font-bold text-slate-800">Ringkasan</h1>
        <p class="text-xs text-slate-400">Selamat kembali, <span id="namaAdmin" class="font-semibold text-slate-600">-</span></p>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="logout()" class="btn btn-soft btn-sm md:hidden">Log Keluar</button>
        <div id="adminAvatar"></div>
      </div>
    </div>

    <!-- Tab mendatar (mobile) -->
    <div class="htabs md:hidden" id="hTabs"></div>

    <div class="p-4 md:p-8 max-w-6xl mx-auto">
      <section id="tab-overview"></section>
      <section id="tab-outlets" class="hidden"></section>
      <section id="tab-staff" class="hidden"></section>
      <section id="tab-products" class="hidden"></section>
      <section id="tab-reports" class="hidden"></section>
      <section id="tab-settings" class="hidden"></section>
    </div>
  </main>
</div>

<!-- ============ MODAL: Kedai (tambah/edit) ============ -->
<div id="modalKedai" class="hidden" onclick="tutupModalLuar(event,'modalKedai')">
  <div class="sheet">
    <div class="flex items-center justify-between mb-4">
      <h3 class="sheet-title" id="kedaiModalTitle">Tambah Kedai</h3>
      <button class="sheet-x" onclick="tutupModal('modalKedai')">✕</button>
    </div>
    <input id="kedaiId" type="hidden" />
    <label class="label">Nama kedai</label>
    <input id="kedaiNama" type="text" class="input mb-1" placeholder="cth: Kedai Runcit Maju" />
    <p class="field-error" id="kedaiNama-err"></p>
    <label class="label">Nama owner</label>
    <input id="kedaiOwner" type="text" class="input mb-1" placeholder="cth: Ahmad Salleh" />
    <p class="field-error" id="kedaiOwner-err"></p>
    <label class="label">No. telefon owner (WhatsApp)</label>
    <input id="kedaiTelefon" type="text" class="input mb-1" placeholder="01X-XXXXXXX" />
    <p class="field-error" id="kedaiTelefon-err"></p>
    <label class="label">Alamat</label>
    <input id="kedaiAlamat" type="text" class="input mb-3" placeholder="Alamat kedai" />
    <label class="label">Kawasan</label>
    <select id="kedaiKawasan" class="select mb-3"></select>
    <label class="label">Mod bayar default</label>
    <select id="kedaiMod" class="select mb-5">
      <option value="bayar_kemudian">Bayar Kemudian (Consignment)</option>
      <option value="bayar_dulu">Bayar Dulu (Beli Putus)</option>
    </select>
    <button class="btn btn-primary btn-block" onclick="simpanKedai()">✓ Simpan Kedai</button>
  </div>
</div>

<!-- ============ MODAL: Staf ============ -->
<div id="modalStaf" class="hidden" onclick="tutupModalLuar(event,'modalStaf')">
  <div class="sheet">
    <div class="flex items-center justify-between mb-4">
      <h3 class="sheet-title">Tambah Staf Kawasan</h3>
      <button class="sheet-x" onclick="tutupModal('modalStaf')">✕</button>
    </div>
    <label class="label">Nama penuh</label>
    <input id="stafNama" type="text" class="input mb-1" placeholder="cth: Rizal Ramli" />
    <p class="field-error" id="stafNama-err"></p>
    <label class="label">No. telefon</label>
    <input id="stafTelefon" type="text" class="input mb-1" placeholder="01X-XXXXXXX" />
    <p class="field-error" id="stafTelefon-err"></p>
    <label class="label">Username (login)</label>
    <input id="stafUsername" type="text" class="input mb-1" placeholder="cth: rizal" />
    <p class="field-error" id="stafUsername-err"></p>
    <label class="label">Kawasan ditugaskan</label>
    <div id="stafKawasanList" class="space-y-2 mb-1"></div>
    <p class="field-error" id="stafKawasan-err"></p>
    <button class="btn btn-primary btn-block mt-4" onclick="simpanStaf()">✓ Simpan Staf</button>
  </div>
</div>

<!-- ============ MODAL: Produk ============ -->
<div id="modalProduk" class="hidden" onclick="tutupModalLuar(event,'modalProduk')">
  <div class="sheet">
    <div class="flex items-center justify-between mb-4">
      <h3 class="sheet-title" id="produkModalTitle">Tambah Produk</h3>
      <button class="sheet-x" onclick="tutupModal('modalProduk')">✕</button>
    </div>
    <input id="produkId" type="hidden" />
    <label class="label">Nama produk</label>
    <input id="produkNama" type="text" class="input mb-1" placeholder="cth: Air Oren Sachet" />
    <p class="field-error" id="produkNama-err"></p>
    <label class="label">SKU</label>
    <input id="produkSku" type="text" class="input mb-1" placeholder="auto-jana jika kosong" />
    <label class="label">Harga per papan (RM)</label>
    <input id="produkHarga" type="number" step="0.01" min="0" class="input mb-1" placeholder="60.00" />
    <p class="field-error" id="produkHarga-err"></p>
    <label class="label">Stok gudang (papan)</label>
    <input id="produkStok" type="number" min="0" value="0" class="input mb-5" />
    <button class="btn btn-primary btn-block" onclick="simpanProduk()">✓ Simpan Produk</button>
  </div>
</div>

<!-- ============ MODAL: Set KPI & Bonus ============ -->
<div id="modalKpi" class="hidden" onclick="tutupModalLuar(event,'modalKpi')">
  <div class="sheet">
    <div class="flex items-center justify-between mb-4">
      <div>
        <h3 class="sheet-title">Set KPI &amp; Bonus</h3>
        <p class="text-xs text-slate-400">Untuk: <span id="kpiNama" class="font-semibold text-slate-600">-</span></p>
      </div>
      <button class="sheet-x" onclick="tutupModal('modalKpi')">✕</button>
    </div>
    <input id="kpiUserId" type="hidden" />
    <label class="label">KPI kutipan bulanan (RM)</label>
    <input id="kpiTarget" type="number" min="0" step="0.01" class="input mb-1" placeholder="150.00" />
    <p class="field-error" id="kpiTarget-err"></p>
    <label class="label">Bonus jika capai KPI (RM)</label>
    <input id="kpiBonus" type="number" min="0" step="0.01" class="input mb-1" placeholder="50.00" />
    <p class="field-error" id="kpiBonus-err"></p>
    <div class="rounded-2xl p-3.5 my-4" style="background:var(--warn-bg);">
      <p class="text-xs" style="color:var(--warn);font-weight:600;">⚠️ Peraturan bonus:</p>
      <p class="text-xs mt-1" style="color:var(--warn);">Jika kutipan bulan ini <b>tidak cukup</b> KPI yang ditetapkan, staf <b>tidak layak sebarang bonus</b>.</p>
    </div>
    <button class="btn btn-primary btn-block" onclick="simpanKpi()">✓ Simpan KPI</button>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/ui.js"></script>
<script>
const user = requireLogin("superadmin");
let tabAktif = "overview";
let penapisReport = "semua";

const TABS = [
  { id: "overview", label: "Ringkasan", ic: "📊" },
  { id: "outlets", label: "Kedai", ic: "🏪" },
  { id: "staff", label: "Staf & Kawasan", ic: "👥" },
  { id: "products", label: "Produk", ic: "📦" },
  { id: "reports", label: "Laporan", ic: "📈" },
  { id: "settings", label: "Tetapan Bayaran", ic: "💳" },
];

function setTab(id) {
  tabAktif = id;
  TABS.forEach((t) => {
    document.getElementById("tab-" + t.id).classList.toggle("hidden", t.id !== id);
  });
  document.getElementById("pageTitle").textContent = TABS.find((t) => t.id === id).label;
  renderNav();
  renderAll();
}

function renderNav() {
  document.getElementById("sideNav").innerHTML = TABS.map((t) => `
    <button class="side-link ${t.id === tabAktif ? "active" : ""}" onclick="setTab('${t.id}')">
      <span>${t.ic}</span> ${t.label}
    </button>`).join("");
  document.getElementById("hTabs").innerHTML = TABS.map((t) => `
    <button class="${t.id === tabAktif ? "active" : ""}" onclick="setTab('${t.id}')">${t.ic} ${t.label}</button>`).join("");
}

function resetConfirm() {
  if (confirm("Set semula SEMUA data demo ke keadaan asal?")) {
    resetDemo();
    window.location.href = "login.html";
  }
}

// =================== OVERVIEW ===================
function renderOverview() {
  const papanTotal = DB.placements.filter((p) => p.status === "aktif").reduce((s, p) => s + p.kuantiti_papan, 0);
  const kutipanBulan = DB.payments
    .filter((p) => p.status === "berjaya" && (p.paid_at || "").startsWith(hariIni().slice(0, 7)))
    .reduce((s, p) => s + p.jumlah, 0);
  const bakiTotal = DB.outlets.reduce((s, o) => s + bakiBelumKutip(o.id), 0);
  const maxBaki = Math.max(...DB.outlets.map((o) => bakiBelumKutip(o.id)), 1);

  const bakiBars = DB.outlets.map((o) => {
    const b = bakiBelumKutip(o.id);
    return `<div>
      <div class="flex justify-between text-xs mb-1.5">
        <span class="text-slate-600 font-medium">${o.nama_kedai}</span>
        <span class="font-bold ${b > 0 ? "text-rose-500" : "text-emerald-600"}">${fmtRM(b)}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max((b / maxBaki) * 100, 2)}%;background:${b > 0 ? "linear-gradient(90deg,#fb7185,#e11d48)" : "#34d399"};"></div></div>
    </div>`;
  }).join("");

  const aktiviti = DB.audit_logs.slice(0, 7).map((a) => `
    <div class="flex items-start gap-3 py-2.5" style="border-bottom:1px solid #f1f5f9;">
      <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0" style="background:var(--brand-50);color:var(--brand-700);">${a.user.split(" ").map((n) => n[0]).slice(0, 2).join("")}</div>
      <div class="flex-1 min-w-0">
        <p class="text-xs text-slate-700"><b>${a.user}</b> · ${a.aksi}</p>
        <p class="text-xs text-slate-400 truncate">${a.ringkasan}</p>
      </div>
      <span class="text-[10px] text-slate-400 flex-shrink-0">${fmtTarikhMasa(a.masa)}</span>
    </div>`).join("");

  document.getElementById("tab-overview").innerHTML = `
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="stat-card anim-fade">
        <div class="stat-ic" style="background:var(--brand-50);">🏪</div>
        <p class="text-xs text-slate-400 font-medium">Jumlah Kedai</p>
        <p class="text-2xl font-extrabold text-slate-800 mt-1">${DB.outlets.length}</p>
      </div>
      <div class="stat-card anim-fade anim-d1">
        <div class="stat-ic" style="background:var(--violet-bg);">📦</div>
        <p class="text-xs text-slate-400 font-medium">Papan Aktif</p>
        <p class="text-2xl font-extrabold text-slate-800 mt-1">${papanTotal} <span class="text-sm font-semibold text-slate-400">papan</span></p>
      </div>
      <div class="stat-card anim-fade anim-d2">
        <div class="stat-ic" style="background:var(--ok-bg);">💰</div>
        <p class="text-xs text-slate-400 font-medium">Kutipan Bulan Ini</p>
        <p class="text-2xl font-extrabold text-emerald-600 mt-1">${fmtRM(kutipanBulan)}</p>
      </div>
      <div class="stat-card anim-fade anim-d3">
        <div class="stat-ic" style="background:var(--danger-bg);">⚠️</div>
        <p class="text-xs text-slate-400 font-medium">Baki Belum Kutip</p>
        <p class="text-2xl font-extrabold text-rose-500 mt-1">${fmtRM(bakiTotal)}</p>
      </div>
    </div>

    <div class="grid lg:grid-cols-2 gap-4 mt-6">
      <div class="card p-5">
        <p class="font-bold text-slate-700 text-sm mb-4">Baki Belum Kutip mengikut Kedai</p>
        <div class="space-y-3.5">${bakiBars}</div>
      </div>
      <div class="card p-5">
        <div class="flex items-center justify-between mb-2">
          <p class="font-bold text-slate-700 text-sm">Aktiviti Terkini</p>
          <span class="chip chip-muted">audit log</span>
        </div>
        ${aktiviti}
      </div>
    </div>`;
}

// =================== OUTLETS ===================
function renderOutlets() {
  const rows = DB.outlets.map((o) => `
    <tr class="hover-row" style="border-bottom:1px solid #f1f5f9;">
      <td class="px-4 py-3.5">
        <div class="flex items-center gap-3">
          ${avatarHtml(o.nama_owner, o.mod_bayar_default === "bayar_dulu" ? "info" : "violet")}
          <div>
            <p class="font-semibold text-slate-700 text-sm">${o.nama_kedai}</p>
            <p class="text-xs text-slate-400">${o.alamat}</p>
          </div>
        </div>
      </td>
      <td class="px-4 py-3.5 text-sm text-slate-500">${o.nama_owner}<br/><span class="text-xs text-slate-400">${o.telefon_owner}</span></td>
      <td class="px-4 py-3.5 text-sm text-slate-500">${kawasanNama(o.kawasan_id)}</td>
      <td class="px-4 py-3.5">${modChip(o.mod_bayar_default)}</td>
      <td class="px-4 py-3.5 text-sm font-semibold text-slate-700">${papanAktif(o.id)} papan</td>
      <td class="px-4 py-3.5 text-sm font-bold ${bakiBelumKutip(o.id) > 0 ? "text-rose-500" : "text-emerald-600"}">${fmtRM(bakiBelumKutip(o.id))}</td>
      <td class="px-4 py-3.5"><button class="btn btn-soft btn-sm" onclick="bukaEditKedai(${o.id})">Edit</button></td>
    </tr>`).join("");

  document.getElementById("tab-outlets").innerHTML = `
    <div class="flex items-center justify-between mb-4">
      <p class="text-sm text-slate-500">${DB.outlets.length} kedai didaftarkan</p>
      <button class="btn btn-primary btn-sm" onclick="bukaTambahKedai()">+ Tambah Kedai</button>
    </div>
    <div class="card overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="th-row" style="background:#f8fafc;border-bottom:1px solid var(--line);">
            <th class="text-left px-4 py-3">Kedai</th>
            <th class="text-left px-4 py-3">Owner</th>
            <th class="text-left px-4 py-3">Kawasan</th>
            <th class="text-left px-4 py-3">Mod Bayar</th>
            <th class="text-left px-4 py-3">Papan Aktif</th>
            <th class="text-left px-4 py-3">Baki</th>
            <th class="text-left px-4 py-3">Aksi</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function bukaTambahKedai() {
  document.getElementById("kedaiModalTitle").textContent = "Tambah Kedai";
  document.getElementById("kedaiId").value = "";
  ["kedaiNama", "kedaiOwner", "kedaiTelefon", "kedaiAlamat"].forEach((id) => (document.getElementById(id).value = ""));
  document.getElementById("kedaiKawasan").innerHTML = DB.kawasan.map((k) => `<option value="${k.id}">${k.nama}</option>`).join("");
  document.getElementById("kedaiMod").value = "bayar_kemudian";
  clearAllErrors(["kedaiNama", "kedaiOwner", "kedaiTelefon"]);
  bukaModal("modalKedai");
}

function bukaEditKedai(id) {
  const o = outletById(id);
  document.getElementById("kedaiModalTitle").textContent = "Edit Kedai";
  document.getElementById("kedaiId").value = o.id;
  document.getElementById("kedaiNama").value = o.nama_kedai;
  document.getElementById("kedaiOwner").value = o.nama_owner;
  document.getElementById("kedaiTelefon").value = o.telefon_owner;
  document.getElementById("kedaiAlamat").value = o.alamat;
  document.getElementById("kedaiKawasan").innerHTML = DB.kawasan.map((k) => `<option value="${k.id}" ${k.id === o.kawasan_id ? "selected" : ""}>${k.nama}</option>`).join("");
  document.getElementById("kedaiMod").value = o.mod_bayar_default;
  clearAllErrors(["kedaiNama", "kedaiOwner", "kedaiTelefon"]);
  bukaModal("modalKedai");
}

function simpanKedai() {
  const nama = document.getElementById("kedaiNama").value.trim();
  const owner = document.getElementById("kedaiOwner").value.trim();
  const telefon = document.getElementById("kedaiTelefon").value.trim();
  let ok = true;
  if (kosong(nama)) { showError("kedaiNama", "Nama kedai wajib diisi"); ok = false; }
  if (kosong(owner)) { showError("kedaiOwner", "Nama owner wajib diisi"); ok = false; }
  if (kosong(telefon)) { showError("kedaiTelefon", "No. telefon wajib diisi"); ok = false; }
  if (!ok) return;

  const data = {
    nama_kedai: nama,
    nama_owner: owner,
    telefon_owner: telefon,
    alamat: document.getElementById("kedaiAlamat").value.trim() || "-",
    kawasan_id: Number(document.getElementById("kedaiKawasan").value),
    mod_bayar_default: document.getElementById("kedaiMod").value,
  };
  const id = Number(document.getElementById("kedaiId").value);
  if (id) {
    Object.assign(outletById(id), data);
    logAksi("Edit kedai", `${data.nama_kedai} dikemas kini`);
    toast("Kedai dikemas kini ✓");
  } else {
    DB.outlets.push({ id: nextId(DB.outlets), ...data });
    logAksi("Daftar kedai", `${data.nama_kedai} (${kawasanNama(data.kawasan_id)})`);
    toast("Kedai baharu didaftarkan ✓");
  }
  saveDB();
  tutupModal("modalKedai");
  renderAll();
}

// =================== STAFF & KAWASAN ===================
function renderStaff() {
  const stafCards = DB.users.filter((u) => u.peranan === "staf").map((u) => {
    const outlets = u.kawasan_ids.flatMap((k) => outletsByKawasan(k));
    const baki = outlets.reduce((s, o) => s + bakiBelumKutip(o.id), 0);
    return `<div class="card p-5">
      <div class="flex items-center gap-3 mb-4">
        ${avatarHtml(u.nama, "ok")}
        <div class="flex-1">
          <p class="font-bold text-slate-700 text-sm">${u.nama}</p>
          <p class="text-xs text-slate-400">${u.telefon} · @${u.username}</p>
        </div>
        ${chip("Staf", "ok")}
      </div>
      <div class="space-y-2 text-xs">
        <div class="flex justify-between"><span class="text-slate-400">Kawasan</span><span class="font-semibold text-slate-600">${u.kawasan_ids.map(kawasanNama).join(", ") || "-"}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">Kedai diuruskan</span><span class="font-semibold text-slate-600">${outlets.length}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">Baki belum kutip</span><span class="font-bold ${baki > 0 ? "text-rose-500" : "text-emerald-600"}">${fmtRM(baki)}</span></div>
      </div>
      ${kpiBlockHtml(u)}
      <button class="btn btn-soft btn-sm w-full mt-3" onclick="bukaSetKpi(${u.id})">🎯 Set KPI &amp; Bonus</button>
    </div>`;
  }).join("");

  const kawasanRows = DB.kawasan.map((k) => {
    const outlets = outletsByKawasan(k.id);
    const staf = DB.users.filter((u) => u.peranan === "staf" && u.kawasan_ids.includes(k.id));
    return `<div class="flex items-center justify-between py-3" style="border-bottom:1px solid #f1f5f9;">
      <div class="flex items-center gap-3">
        <div class="icon-tile" style="background:var(--violet-bg);">📍</div>
        <div>
          <p class="text-sm font-semibold text-slate-700">${k.nama}</p>
          <p class="text-xs text-slate-400">${outlets.length} kedai · ${staf.length} staf</p>
        </div>
      </div>
      ${chip(staf.length ? "Ditugaskan" : "Kosong", staf.length ? "ok" : "warn")}
    </div>`;
  }).join("");

  document.getElementById("tab-staff").innerHTML = `
    <div class="flex items-center justify-between mb-4">
      <p class="text-sm text-slate-500">${DB.users.filter((u) => u.peranan === "staf").length} staf · ${DB.kawasan.length} kawasan</p>
      <div class="flex gap-2">
        <button class="btn btn-soft btn-sm" onclick="bukaTambahKawasan()">+ Kawasan</button>
        <button class="btn btn-primary btn-sm" onclick="bukaTambahStaf()">+ Tambah Staf</button>
      </div>
    </div>

  return `
    <div class="rounded-2xl p-3.5 mt-3" style="background:var(--bg);">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold text-slate-500">🎯 KPI bulan ini</span>
        ${k.layak ? chip("Capai KPI ✓", "ok") : chip("Belum capai", "warn")}
      </div>
      <div class="flex justify-between text-xs mb-1.5">
        <span class="text-slate-500">Kutipan <b class="text-slate-700">${fmtRM(k.capaian)}</b> / ${fmtRM(k.target)}</span>
        <span class="font-bold text-slate-600">${k.pct}%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(k.pct, 2)}%;background:${warnaBar};"></div></div>
      <div class="flex justify-between items-center mt-2.5">
        <span class="text-xs text-slate-400">Bonus bila capai KPI</span>
        <span class="text-xs font-bold ${k.layak ? "text-emerald-600" : "text-slate-400"}">${k.layak ? fmtRM(k.bonus) + " (layak)" : "Tiada bonus — KPI belum cukup"}</span>
      </div>

}

function bukaSetKpi(userId) {
  const u = userById(userId);
  document.getElementById("kpiUserId").value = u.id;
  document.getElementById("kpiNama").textContent = u.nama;
  document.getElementById("kpiTarget").value = u.kpi ? u.kpi.target : 0;
  document.getElementById("kpiBonus").value = u.kpi ? u.kpi.bonus : 0;
  clearAllErrors(["kpiTarget", "kpiBonus"]);
  bukaModal("modalKpi");
}

function simpanKpi() {
  const u = userById(Number(document.getElementById("kpiUserId").value));
  const target = Number(document.getElementById("kpiTarget").value);
  const bonus = Number(document.getElementById("kpiBonus").value);
  let ok = true;
  if (kosong(target) || target <= 0) { showError("kpiTarget", "KPI mesti lebih besar dari RM 0.00"); ok = false; }
  if (kosong(bonus) || bonus < 0) { showError("kpiBonus", "Bonus mesti RM 0.00 atau lebih"); ok = false; }
  if (!ok) return;
  u.kpi = { target, bonus };
  logAksi("Set KPI staf", `${u.nama} — KPI ${fmtRM(target)}, bonus ${fmtRM(bonus)}`);
  saveDB();
  tutupModal("modalKpi");
  toast("KPI " + u.nama + " disimpan");
  renderAll();
}

function bukaTambahKawasan() {
  const nama = prompt("Nama kawasan baharu:");
  if (nama && nama.trim()) {
    DB.kawasan.push({ id: nextId(DB.kawasan), nama: nama.trim() });
    logAksi("Tambah kawasan", nama.trim());
    saveDB();
    toast("Kawasan ditambah ✓");
    renderAll();
  }
}

function bukaTambahStaf() {
  document.getElementById("stafNama").value = "";
  document.getElementById("stafTelefon").value = "";
  document.getElementById("stafUsername").value = "";
  document.getElementById("stafKawasanList").innerHTML = DB.kawasan.map((k) => `
    <label class="flex items-center gap-2.5 cursor-pointer">
      <input type="checkbox" class="staf-kw w-4 h-4 rounded" value="${k.id}" />
      <span class="text-sm text-slate-600">${k.nama}</span>
    </label>`).join("");
  clearAllErrors(["stafNama", "stafTelefon", "stafUsername"]);
  document.getElementById("stafKawasan-err").style.display = "none";
  bukaModal("modalStaf");
}

function simpanStaf() {
  const nama = document.getElementById("stafNama").value.trim();
  const telefon = document.getElementById("stafTelefon").value.trim();
  const username = document.getElementById("stafUsername").value.trim();
  const kwIds = Array.from(document.querySelectorAll(".staf-kw:checked")).map((c) => Number(c.value));
  let ok = true;
  if (kosong(nama)) { showError("stafNama", "Nama wajib diisi"); ok = false; }
  if (kosong(telefon)) { showError("stafTelefon", "Telefon wajib diisi"); ok = false; }
  if (kosong(username)) { showError("stafUsername", "Username wajib diisi"); ok = false; }
  else if (DB.users.some((u) => u.username === username)) { showError("stafUsername", "Username sudah digunakan"); ok = false; }
  if (!kwIds.length) {
    const err = document.getElementById("stafKawasan-err");
    err.textContent = "Pilih sekurang-kurangnya satu kawasan";
    err.style.display = "block";
    ok = false;
  }
  if (!ok) return;

  DB.users.push({
    id: nextId(DB.users), nama, telefon, username,
    peranan: "staf", kawasan_ids: kwIds,
  });
  logAksi("Daftar staf", `${nama} — kawasan ${kwIds.map(kawasanNama).join(", ")}`);
  saveDB();
  tutupModal("modalStaf");
  toast("Staf baharu didaftarkan ✓");
  renderAll();
}

function bukaTambahProduk() {
  document.getElementById("produkModalTitle").textContent = "Tambah Produk";
  document.getElementById("produkId").value = "";
  document.getElementById("produkNama").value = "";
  document.getElementById("produkSku").value = "";
  document.getElementById("produkHarga").value = "";
  document.getElementById("produkStok").value = 0;
  clearAllErrors(["produkNama", "produkHarga"]);
  bukaModal("modalProduk");
}

function bukaEditProduk(id) {
  const p = productById(id);
  document.getElementById("produkModalTitle").textContent = "Edit Produk";
  document.getElementById("produkId").value = p.id;
  document.getElementById("produkNama").value = p.nama;
  document.getElementById("produkSku").value = p.sku;
  document.getElementById("produkHarga").value = p.harga_papan;
  document.getElementById("produkStok").value = p.stok_gudang;
  clearAllErrors(["produkNama", "produkHarga"]);
  bukaModal("modalProduk");
}

function simpanProduk() {
  const nama = document.getElementById("produkNama").value.trim();
  const harga = Number(document.getElementById("produkHarga").value);
  let ok = true;
  if (kosong(nama)) { showError("produkNama", "Nama produk wajib diisi"); ok = false; }
  if (kosong(harga) || harga <= 0) { showError("produkHarga", "Harga mesti lebih besar dari RM 0.00"); ok = false; }
  if (!ok) return;

  const sku = document.getElementById("produkSku").value.trim() ||
    "SKU-" + nama.replace(/\s+/g, "-").toUpperCase().slice(0, 12);
  const data = {
    nama, sku,
    harga_papan: harga,
    stok_gudang: Number(document.getElementById("produkStok").value) || 0,
    unit: "papan",
  };
  const id = Number(document.getElementById("produkId").value);
  if (id) {
    Object.assign(productById(id), data);
    logAksi("Edit produk", `${nama} — ${fmtRM(harga)}/papan`);
    toast("Produk dikemas kini ✓");
  } else {
    DB.products.push({ id: nextId(DB.products), ...data });
    logAksi("Tambah produk", `${nama} — ${fmtRM(harga)}/papan`);
    toast("Produk baharu ditambah ✓");
  }
  saveDB();
  tutupModal("modalProduk");
  renderAll();
}

// =================== REPORTS ===================
function renderReports() {
  const cashTotal = DB.payments.filter((p) => p.kaedah === "cash" && p.status === "berjaya").reduce((s, p) => s + p.jumlah, 0);
  const onlineTotal = DB.payments.filter((p) => p.kaedah !== "cash" && p.status === "berjaya").reduce((s, p) => s + p.jumlah, 0);
  const total = cashTotal + onlineTotal || 1;

  const kaedahHtml = `
    <div>
      <div class="flex justify-between text-xs mb-1.5"><span class="text-slate-600 font-medium">💵 Cash</span><span class="font-bold text-slate-700">${fmtRM(cashTotal)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(cashTotal / total) * 100}%;background:linear-gradient(90deg,#fbbf24,#d97706);"></div></div>
    </div>
    <div>
      <div class="flex justify-between text-xs mb-1.5"><span class="text-slate-600 font-medium">📱 QR / FPX (Billplz)</span><span class="font-bold text-slate-700">${fmtRM(onlineTotal)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(onlineTotal / total) * 100}%;background:linear-gradient(90deg,#818cf8,#4f46e5);"></div></div>
    </div>`;

  const stafHtml = DB.users.filter((u) => u.peranan === "staf").map((u) => {
    const outletIds = u.kawasan_ids.flatMap((k) => outletsByKawasan(k).map((o) => o.id));
    const kutip = kutipanBerjaya(outletIds, null);
    return `<div>
      <div class="flex justify-between text-xs mb-1.5"><span class="text-slate-600 font-medium">${u.nama}</span><span class="font-bold text-slate-700">${fmtRM(kutip)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max((kutip / total) * 100, 2)}%;background:linear-gradient(90deg,#34d399,#059669);"></div></div>
    </div>`;
  }).join("");

  // Peristiwa + penapis
  const semua = DB.collection_events.slice().sort((a, b) => b.tarikh_event.localeCompare(a.tarikh_event));
  const ditapis = penapisReport === "semua" ? semua : semua.filter((e) => e.status === penapisReport);
  const rows = ditapis.map((e) => {
    const o = outletById(e.outlet_id);
    return `<tr class="hover-row" style="border-bottom:1px solid #f1f5f9;">
      <td class="px-4 py-3 text-sm text-slate-500">${fmtTarikh(e.tarikh_event)}</td>
      <td class="px-4 py-3 text-sm font-semibold text-slate-700">${o ? o.nama_kedai : "-"}</td>
      <td class="px-4 py-3 text-sm text-slate-500">${e.jenis === "papan_habis" ? "Papan Habis" : "Bayar Dulu"}</td>
      <td class="px-4 py-3 text-sm text-slate-700">${fmtRM(e.jumlah)}</td>
      <td class="px-4 py-3">${statusChip(e.status)}</td>
    </tr>`;
  }).join("") || `<tr><td colspan="5" class="px-4 py-8 text-center text-sm text-slate-400">Tiada rekod untuk penapis ini.</td></tr>`;

  const penapis = [
    { id: "semua", label: "Semua" },
    { id: "belum_bayar", label: "Belum Bayar" },
    { id: "separa", label: "Separa" },
    { id: "dibayar", label: "Dibayar" },
  ].map((f) => `<button class="${penapisReport === f.id ? "active" : ""}" onclick="setPenapis('${f.id}')">${f.label}</button>`).join("");

  document.getElementById("tab-reports").innerHTML = `
    <div class="grid md:grid-cols-2 gap-4">
      <div class="card p-5">
        <p class="font-bold text-slate-700 text-sm mb-4">Kutipan: Cash vs Online</p>
        <div class="space-y-4">${kaedahHtml}</div>
      </div>
      <div class="card p-5">
        <p class="font-bold text-slate-700 text-sm mb-4">Prestasi Staf (kutipan berjaya)</p>
        <div class="space-y-4">${stafHtml}</div>
      </div>
    </div>

    <div class="card mt-6 p-5">
      <div class="flex items-center justify-between mb-1">
        <p class="font-bold text-slate-700 text-sm">🎯 KPI &amp; Bonus Staf — bulan ini</p>
        ${chip("Tak cukup KPI = tiada bonus", "warn")}
      </div>
      <p class="text-xs text-slate-400 mb-4">Setiap staf ada KPI kutipan bulanan yang berbeza. Bonus hanya dilepaskan bila KPI dicapai.</p>
      <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${kpiPanelHtml()}</div>
    </div>

    <div class="card mt-6 overflow-x-auto">
      <div class="flex items-center justify-between p-4 pb-2">
        <p class="font-bold text-slate-700 text-sm">Tanggungjawab Bayaran</p>
        <div class="htabs p-0">${penapis}</div>
      </div>
      <table class="w-full text-sm">
        <thead>
          <tr class="th-row" style="background:#f8fafc;border-bottom:1px solid var(--line);">
            <th class="text-left px-4 py-3">Tarikh</th>
            <th class="text-left px-4 py-3">Kedai</th>
            <th class="text-left px-4 py-3">Jenis</th>
            <th class="text-left px-4 py-3">Jumlah</th>
            <th class="text-left px-4 py-3">Status</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function setPenapis(id) {
  penapisReport = id;
  renderReports();
}

      <div class="flex items-center gap-3 mb-3">
        ${avatarHtml(u.nama, k.layak ? "ok" : "warn")}

          <p class="text-sm font-bold text-slate-700">${u.nama}</p>

      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(k.pct, 2)}%;background:${k.layak ? "linear-gradient(90deg,#34d399,#059669)" : "linear-gradient(90deg,#fb7185,#e11d48)"};"></div></div>

  }).join("");
}
